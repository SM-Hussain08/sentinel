name: sentinel-e2e

services:
  e2e-postgres:
    image: postgres:17-alpine

    restart: "no"

    environment:
      POSTGRES_USER: sentinel_e2e
      POSTGRES_PASSWORD: sentinel_e2e
      POSTGRES_DB: sentinel_e2e

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentinel_e2e -d sentinel_e2e"
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s


  e2e-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: "no"

    networks:
      default:
        aliases:
          - backend

    environment:
      APP_ENV: e2e
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://sentinel_e2e:sentinel_e2e@e2e-postgres:5432/sentinel_e2e

      OLLAMA_ENABLED: "false"

    depends_on:
      e2e-postgres:
        condition: service_healthy

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  e2e-event-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: "no"

    environment:
      APP_ENV: e2e
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://sentinel_e2e:sentinel_e2e@e2e-postgres:5432/sentinel_e2e

      OLLAMA_ENABLED: "false"

      SENTINEL_PROCESSOR_POLL_SECONDS: "1"
      SENTINEL_PROCESSOR_BATCH_SIZE: "100"
      SENTINEL_PROCESSOR_WORKER_ID: "processor-e2e"

    depends_on:
      e2e-backend:
        condition: service_healthy

    working_dir: /app

    command:
      [
        "python",
        "-m",
        "app.workers.event_processor"
      ]


  e2e-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    restart: "no"

    ports:
      - "127.0.0.1:18080:80"

    depends_on:
      e2e-backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/healthz"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  e2e-playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e

    restart: "no"

    environment:
      SENTINEL_E2E_BASE_URL: http://e2e-frontend
      CI: "true"

    depends_on:
      e2e-frontend:
        condition: service_healthy

    command:
      [
        "npm",
        "run",
        "e2e"
      ]