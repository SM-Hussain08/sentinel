services:
  # ==========================================================
  # Operational PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine
    container_name: sentinel-postgres

    restart: unless-stopped

    # --------------------------------------------------------
    # Runtime safeguards
    # --------------------------------------------------------

    # PostgreSQL normally uses well under 100 MiB in the
    # SENTINEL workload, but receives generous headroom for
    # queries, maintenance, and benchmark-sized operations.
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128

    # PostgreSQL's image uses SIGINT for graceful shutdown.
    # Allow enough time for clean checkpointing and WAL flush.
    stop_grace_period: 60s

    # Prevent unbounded json-file growth on long-running hosts.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}

    # PostgreSQL is internal-only in the default deployment.
    # Use docker-compose.dev.yml when direct host access is
    # intentionally required for development or debugging.
    expose:
      - "5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ==========================================================
  # FastAPI backend
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sentinel-backend

    restart: unless-stopped

    # --------------------------------------------------------
    # Runtime safeguards
    # --------------------------------------------------------

    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 64

    # Allows Uvicorn and in-flight requests time to terminate
    # cleanly before Docker escalates to SIGKILL.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Run the application as an unprivileged account.
    user: "10001:10001"

    # Prevent privilege escalation through setuid/setgid
    # binaries or similar mechanisms.
    security_opt:
      - no-new-privileges:true

    # FastAPI/Alembic do not require Linux capabilities.
    cap_drop:
      - ALL

    # Application code and model artifacts are immutable at
    # runtime. Temporary files remain available through /tmp.
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    environment:
      APP_ENV: docker
      DEBUG: "false"

      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}

      # Ollama intentionally remains installed on the host.
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # FastAPI is internal-only in the default deployment.
    # Nginx is the public application gateway.
    #
    # Use docker-compose.dev.yml when direct host access to
    # port 8000 is intentionally required.
    expose:
      - "8000"

    volumes:
      - ./ml_engine/evaluation:/app/ml_engine/evaluation:ro
      - ./ml_engine/models/artifacts:/app/ml_engine/models/artifacts:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  # ==========================================================
  # Always-on SENTINEL event processor
  # ==========================================================
  #
  # This is part of normal SENTINEL operation.
  #
  # It:
  # - discovers newly arrived Events;
  # - scores them with the selected detector;
  # - performs incremental correlation;
  # - creates/evolves Incidents;
  # - refreshes deterministic investigations.
  #
  # It does NOT depend on the simulator.
  #

  event-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sentinel-event-processor

    restart: unless-stopped

    # --------------------------------------------------------
    # Runtime safeguards
    # --------------------------------------------------------

    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 64

    # The processor handles SIGTERM and persists runtime state
    # before exiting, so give it time to shut down cleanly.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    user: "10001:10001"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m


    environment:
      APP_ENV: processor
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}

      OLLAMA_ENABLED: "false"

      SENTINEL_PROCESSOR_POLL_SECONDS: ${SENTINEL_PROCESSOR_POLL_SECONDS:-1}
      SENTINEL_PROCESSOR_BATCH_SIZE: ${SENTINEL_PROCESSOR_BATCH_SIZE:-100}
      SENTINEL_PROCESSOR_WORKER_ID: ${SENTINEL_PROCESSOR_WORKER_ID:-processor-docker}

    # Backend health is the operational schema-ready boundary.
    # The backend runs Alembic migrations before becoming healthy.
    #
    # The processor remains independent from the optional simulator.
    depends_on:
      backend:
        condition: service_healthy

    working_dir: /app

    command:
      [
        "python",
        "-m",
        "app.workers.event_processor"
      ]


  # ==========================================================
  # Production React / Nginx application gateway
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    container_name: sentinel-frontend

    restart: unless-stopped

    # --------------------------------------------------------
    # Runtime safeguards
    # --------------------------------------------------------

    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 64

    # The official Nginx image uses SIGQUIT for graceful stop.
    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/healthz"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ==========================================================
  # Reproducible benchmark PostgreSQL
  # ==========================================================
  #
  # Completely isolated from SENTINEL's operational database.
  #
  # Normal:
  #
  #     docker compose up
  #
  # does NOT start this service.
  #

  benchmark-postgres:
    image: postgres:17-alpine
    container_name: sentinel-benchmark-postgres

    profiles:
      - benchmark

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_benchmark_password
      POSTGRES_DB: sentinel_benchmark

    expose:
      - "5432"

    volumes:
      - sentinel_benchmark_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentinel -d sentinel_benchmark"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ==========================================================
  # One-shot reproducible benchmark runner
  # ==========================================================

  benchmark-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile

    profiles:
      - benchmark

    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    environment:
      APP_ENV: benchmark
      DEBUG: "false"

      SENTINEL_BENCHMARK_MODE: "true"

      DATABASE_URL: >-
        postgresql+psycopg://sentinel:sentinel_benchmark_password@benchmark-postgres:5432/sentinel_benchmark

      OLLAMA_ENABLED: "false"

    depends_on:
      benchmark-postgres:
        condition: service_healthy

    volumes:
      - ./ml_engine/evaluation:/app/ml_engine/evaluation
      - ./ml_engine/models:/app/ml_engine/models
      - ./ml_engine/data:/app/ml_engine/data

    working_dir: /app/backend

    command:
      [
        "sh",
        "-c",
        "alembic -c alembic.ini upgrade head && cd /app && python scripts/run_benchmark.py"
      ]

    restart: "no"


  # ==========================================================
  # One-shot operational employee generator
  # ==========================================================

  employee-generator:
    build:
      context: .
      dockerfile: backend/Dockerfile

    profiles:
      - utilities

    environment:
      APP_ENV: utility
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}

      OLLAMA_ENABLED: "false"

    # This optional utility writes to the operational schema.
    # Backend health guarantees Alembic migrations are complete.
    depends_on:
      backend:
        condition: service_healthy

    working_dir: /app

    entrypoint:
      [
        "python",
        "/app/scripts/generate_employees.py"
      ]

    restart: "no"


  # ==========================================================
  # Explicit historical Event backfill
  # ==========================================================
  #
  # Examples:
  #
  #   docker compose \
  #     --profile utilities \
  #     run --rm event-backfill
  #
  #   docker compose \
  #     --profile utilities \
  #     run --rm event-backfill \
  #     2026-09-18
  #
  # This is intentionally a one-shot maintenance utility.
  # It is NOT a second processor daemon.
  #

  event-backfill:
    build:
      context: .
      dockerfile: backend/Dockerfile

    profiles:
      - utilities

    environment:
      APP_ENV: utility
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}

      OLLAMA_ENABLED: "false"

    # Historical backfill requires the complete operational schema.
    # Backend health guarantees Alembic migrations are complete.
    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./ml_engine/models/artifacts:/app/ml_engine/models/artifacts:ro

    working_dir: /app

    entrypoint:
      [
        "python",
        "/app/scripts/backfill_unprocessed_events.py"
      ]

    restart: "no"


  # ==========================================================
  # Optional live corporate simulator
  # ==========================================================
  #
  # Normal SENTINEL does NOT require this service.
  #
  # Start:
  #
  #   docker compose \
  #     --profile simulation \
  #     up -d simulator-worker
  #
  # Default attack rate is zero, so without explicit configuration
  # this generates only normal corporate behavior.
  #
  # Example demo mode:
  #
  #   SENTINEL_SIM_PRESET=demo \
  #   docker compose \
  #     --profile simulation \
  #     up -d simulator-worker
  #

  simulator-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sentinel-simulator-worker

    profiles:
      - simulation

    restart: unless-stopped

    environment:
      APP_ENV: simulation
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}

      OLLAMA_ENABLED: "false"

      SENTINEL_SIM_PRESET: ${SENTINEL_SIM_PRESET:-normal}
      SENTINEL_SIM_ATTACK_RATE: ${SENTINEL_SIM_ATTACK_RATE:-0}
      SENTINEL_SIM_SEED: ${SENTINEL_SIM_SEED:-9300}

      SENTINEL_SIM_TICK_SECONDS: ${SENTINEL_SIM_TICK_SECONDS:-1}
      SENTINEL_SIM_SPEED: ${SENTINEL_SIM_SPEED:-1}

      SENTINEL_SIM_HEARTBEAT_SECONDS: ${SENTINEL_SIM_HEARTBEAT_SECONDS:-5}
      SENTINEL_SIM_EMPLOYEE_REFRESH_SECONDS: ${SENTINEL_SIM_EMPLOYEE_REFRESH_SECONDS:-30}

      SENTINEL_SIM_MAX_EVENTS_PER_TICK: ${SENTINEL_SIM_MAX_EVENTS_PER_TICK:-100}
      SENTINEL_SIM_MAX_EVENTS_PER_EMPLOYEE_PER_TICK: ${SENTINEL_SIM_MAX_EVENTS_PER_EMPLOYEE_PER_TICK:-3}

      SENTINEL_SIM_SCENARIO_COOLDOWN_MINUTES: ${SENTINEL_SIM_SCENARIO_COOLDOWN_MINUTES:-360}
      SENTINEL_SIM_MAX_CONCURRENT_ATTACKS: ${SENTINEL_SIM_MAX_CONCURRENT_ATTACKS:-1}

      SENTINEL_SIM_WORKER_ID: ${SENTINEL_SIM_WORKER_ID:-simulator-docker}
      SENTINEL_SIM_WORKER_VERSION: "1.0"

    # The simulator writes Events and simulation runtime metadata
    # into the operational database, so it waits for the backend's
    # schema-ready health boundary.
    #
    # It intentionally does NOT depend on event-processor.
    # The event processor independently discovers newly committed
    # Events whenever it is running.
    depends_on:
      backend:
        condition: service_healthy

    working_dir: /app

    command:
      [
        "python",
        "-m",
        "simulator.runtime.worker"
      ]


# ============================================================
# Persistent volumes
# ============================================================

volumes:
  sentinel_postgres_data:
  sentinel_benchmark_postgres_data: