server {
    listen 80;
    listen [::]:80;

    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;


    # ---------------------------------------------------------
    # Container health endpoint
    # ---------------------------------------------------------

    location = /healthz {
        access_log off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # ---------------------------------------------------------
    # SENTINEL API reverse proxy
    # ---------------------------------------------------------
    #
    # No trailing slash is intentionally used on proxy_pass.
    # This preserves the original URI:
    #
    #   /api/v1/incidents
    #
    # instead of rewriting it before it reaches FastAPI.
    # ---------------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }


    # ---------------------------------------------------------
    # Vite fingerprinted static assets
    # ---------------------------------------------------------

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control
            "public, max-age=31536000, immutable";
    }


    # ---------------------------------------------------------
    # React SPA
    # ---------------------------------------------------------
    #
    # BrowserRouter routes such as:
    #
    #   /incidents/INC-2026-0001
    #   /anomalies/<event-id>
    #   /employees/<user-id>
    #
    # must resolve to index.html when requested directly.
    # ---------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control
            "no-cache";
    }
}
