[pytest]
minversion = 8.4

testpaths =
    backend/tests

pythonpath =
    backend
    .

addopts =
    -ra
    --strict-config
    --strict-markers

markers =
    unit: Pure unit tests with no external services.
    api: FastAPI endpoint and response-contract tests.
    integration: Tests involving multiple SENTINEL components.
    postgres: Tests requiring the isolated PostgreSQL test database.
    ml: Production-model and ML pipeline invariant tests.
    safety: Ground-truth isolation and security-boundary tests.
    processor: Event processor and runtime-state tests.

filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\.:DeprecationWarning:joblib\.numpy_pickle
